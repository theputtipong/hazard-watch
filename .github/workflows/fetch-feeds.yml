# Runs on GitHub because BMA and ThaiWater block Cloudflare IPs.
name: Fetch Feeds

on:
  schedule:
    # Fallback only: the ingest cron dispatches this every 40 min. Both together must stay under ~2,000 free min/month.
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest-runner
  cancel-in-progress: true

jobs:
  run:
    name: Fetch feeds
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @hw/ingest...
      - name: Fetch feeds
        run: pnpm --filter @hw/ingest runner
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
