name: mobile

# Generated tokens and strings are checked for staleness by `pnpm test` in ci.yml.
on:
  push:
    branches: [main]
    # Path filters do not apply to tag pushes.
    tags: ['v*']
    paths:
      - 'apps/mobile/**'
      - 'packages/tokens/**'
      - 'packages/core/src/i18n/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/tokens/**'
      - 'packages/core/src/i18n/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: 3.44.8

defaults:
  run:
    working-directory: apps/mobile

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # hw_theme.dart is copied verbatim from the mobile design system, so it keeps that file's formatting.
      - run: find lib test -name '*.dart' ! -path lib/theme/hw_theme.dart ! -path 'lib/l10n/gen/*' | xargs dart format --set-exit-if-changed
      - run: flutter analyze
      - run: flutter test

  # One job for both builds so the Flutter and Gradle setup is paid once. The APK is debug-signed (for testing, not
  # Play); the Play upload AAB is signed with the upload key, skipped (with a notice) until the key secrets are set
  # (commands in apps/mobile/README.md), and never built on pull requests, so forks never see the key.
  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Built before the key is decoded, so it falls back to the debug key.
      - run: flutter build apk --release --build-number ${{ github.run_number }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hazardwatch-android-${{ github.run_number }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      # Secrets go only to the two steps that need them, never to actions.
      - id: key
        if: github.event_name != 'pull_request'
        working-directory: .
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_PASSWORD not set, skipping the signed AAB."
          fi
      - if: steps.key.outputs.present == 'true'
        name: Decode upload key
        working-directory: .
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}
        run: |
          umask 077
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload.jks\n' \
            "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > "$RUNNER_TEMP/key.properties"
      # Release AABs fail in Gradle without the key, so this stays behind the secrets check.
      - if: steps.key.outputs.present == 'true'
        env:
          HW_KEY_PROPERTIES: ${{ runner.temp }}/key.properties
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols --build-number ${{ github.run_number }}
      # Before any later action runs.
      - if: always() && steps.key.outputs.present == 'true'
        working-directory: .
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/key.properties"
      - if: steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hazardwatch-android-aab-${{ github.run_number }}
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
      # Obfuscated stack traces can only be read with the symbols of the exact build (`flutter symbolize`).
      - if: steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hazardwatch-android-symbols-${{ github.run_number }}
          path: apps/mobile/build/symbols
          retention-days: 90

  # Proves the iOS build compiles. No signing certificate yet, so the output cannot be installed and is not uploaded.
  # Manual or version tags only: macOS minutes count 10x against the private repo's free quota.
  ios:
    needs: check
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/symbols --build-number ${{ github.run_number }}
