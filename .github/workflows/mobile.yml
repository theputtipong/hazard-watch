name: mobile

# Generated tokens and strings are checked for staleness by `pnpm test` in ci.yml.
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/tokens/**'
      - 'packages/core/src/i18n/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/tokens/**'
      - 'packages/core/src/i18n/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: 3.44.8

defaults:
  run:
    working-directory: apps/mobile

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # hw_theme.dart is copied verbatim from the mobile design system, so it keeps that file's formatting.
      - run: find lib test -name '*.dart' ! -path lib/theme/hw_theme.dart ! -path 'lib/l10n/gen/*' | xargs dart format --set-exit-if-changed
      - run: flutter analyze
      - run: flutter test

  # Debug-signed: installable for testing, not for Play (android-release builds the Play upload).
  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --release --build-number ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: hazardwatch-android-${{ github.run_number }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # Play upload bundle, signed with the upload key. Skipped (with a notice) until the key secrets are set; the
  # commands are in apps/mobile/README.md. Never on pull requests, so forks never see the key.
  android-release:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}
    steps:
      - id: key
        working-directory: .
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_PASSWORD not set, skipping the signed AAB."
          fi
      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4
      - if: steps.key.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - if: steps.key.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - if: steps.key.outputs.present == 'true'
        name: Decode upload key
        run: |
          umask 077
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload.jks\n' \
            "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > "$RUNNER_TEMP/key.properties"
      - if: steps.key.outputs.present == 'true'
        env:
          HW_KEY_PROPERTIES: ${{ runner.temp }}/key.properties
        run: flutter build appbundle --release --build-number ${{ github.run_number }}
      - if: steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hazardwatch-android-aab-${{ github.run_number }}
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
      - if: always() && steps.key.outputs.present == 'true'
        working-directory: .
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/key.properties"

  # Proves the iOS build compiles. No signing certificate yet, so the output cannot be installed and is not uploaded.
  ios:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build ios --release --no-codesign --build-number ${{ github.run_number }}
