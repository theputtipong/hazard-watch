# Needs no extra secrets: uses only the built-in GITHUB_TOKEN.
name: monitor

on:
  schedule:
    # With the 30-min runner this stays inside the 2,000 free Actions min/month of a private repo.
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/monitor
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tools/monitor/check.test.mjs
      - run: node tools/monitor/check.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
