name: Release iOS

# Proves the iOS build compiles. No signing certificate yet, so the output cannot be installed and is not uploaded;
# a tag ios-vX.Y.Z only gets a notes-only GitHub Release. Tag or manual only: macOS minutes count 10x.
on:
  push:
    tags: ['ios-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-ios
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  release-ios:
    name: Release iOS
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      # gh release create.
      contents: write
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "code=$RUN_NUMBER" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = "tag" ]; then
            name="${REF_NAME#ios-v}"
            if ! printf '%s\n' "$name" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Tag $REF_NAME is not ios-vX.Y.Z"
              exit 1
            fi
            echo "name=$name" >> "$GITHUB_OUTPUT"
          fi
      # No cache: a release build must not restore anything a PR run could have written.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      # No codesign: there is no signing certificate yet.
      - name: Build
        env:
          BUILD_NAME: ${{ steps.version.outputs.name }}
          BUILD_NUMBER: ${{ steps.version.outputs.code }}
        run: |
          set -- --build-number "$BUILD_NUMBER"
          if [ -n "$BUILD_NAME" ]; then set -- "$@" --build-name "$BUILD_NAME"; fi
          flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/symbols "$@"
      - if: github.ref_type == 'tag'
        name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ steps.version.outputs.name }}
        run: gh release create "$TAG" --verify-tag --generate-notes --title "iOS $NAME"
