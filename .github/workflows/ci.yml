name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_all:
        description: Deploy ingest and web even if they did not change
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hw/web exec next typegen
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  changes:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      ingest: ${{ steps.filter.outputs.ingest == 'true' || inputs.deploy_all == true }}
      web: ${{ steps.filter.outputs.web == 'true' || inputs.deploy_all == true }}
      extension: ${{ steps.filter.outputs.extension }}
    steps:
      # Keeps the token: paths-filter git-fetches the push base, which a private repo requires auth for.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            ingest:
              - 'apps/ingest/**'
              - 'packages/**'
              - 'apps/web/public/geo/districts.json'
              - 'pnpm-lock.yaml'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
            extension:
              - 'apps/extension/**'
              - 'packages/**'
              - 'apps/web/public/geo/**'

  # API first: the web reads fields (e.g. wind) that only a new ingest returns.
  deploy-ingest:
    needs: [check, changes]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.ingest == 'true'
    runs-on: ubuntu-latest
    concurrency: { group: deploy-ingest, cancel-in-progress: false }
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @hw/ingest...
      # The token goes only to the wrangler steps, never to actions or install scripts.
      - run: pnpm --filter @hw/ingest exec wrangler d1 migrations apply hw-push --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: pnpm --filter @hw/ingest run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-web:
    needs: [check, changes, deploy-ingest]
    if: >-
      always() && github.ref == 'refs/heads/main' && needs.check.result == 'success'
      && needs.changes.outputs.web == 'true' && needs.deploy-ingest.result != 'failure'
    runs-on: ubuntu-latest
    concurrency: { group: deploy-web, cancel-in-progress: false }
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_API_BASE: https://api.hazard.pdouvch.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @hw/web...
      # Same commands as the package's deploy script, split so the build never sees the token.
      - run: pnpm --filter @hw/web exec opennextjs-cloudflare build
      - run: pnpm --filter @hw/web exec opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # Store uploads stay manual: download the zip from the run's artifacts.
  extension:
    needs: [check, changes]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @hw/extension...
      - run: pnpm --filter @hw/extension run zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hazardwatch-extension
          path: apps/extension/hazardwatch-extension-*.zip
