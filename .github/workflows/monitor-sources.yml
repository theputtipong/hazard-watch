# Needs no extra secrets: uses only the built-in GITHUB_TOKEN.
name: Monitor Sources

on:
  schedule:
    # With the 30-min runner this stays inside the 2,000 free Actions min/month of a private repo.
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    name: Check sources
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      # Opens and closes `outage` issues.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/monitor
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Test
        run: node --test tools/monitor/check.test.mjs
      - name: Check sources
        run: node tools/monitor/check.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
