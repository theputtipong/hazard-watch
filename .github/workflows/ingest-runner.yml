# Runs on GitHub because BMA and ThaiWater block Cloudflare IPs.
name: ingest-runner

on:
  schedule:
    # Private repos get ~2,000 free Actions min/month; every 10 min would need ~4,300.
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: ingest-runner
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @hw/ingest...
      - run: pnpm --filter @hw/ingest runner
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
