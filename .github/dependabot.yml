version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: chore(deps)

  # One pnpm workspace lockfile at the root covers apps/* and packages/*.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ['*']
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: pub
    directory: /apps/mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pub:
        patterns: ['*']
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: gradle
    directory: /apps/mobile/android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gradle:
        patterns: ['*']
    commit-message:
      prefix: chore(deps)
