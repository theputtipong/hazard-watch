name: hazardwatch
description: "HazardWatch (เฝ้าระวังภัย) mobile app: same public API as the web, HazardWatch Mobile design system."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  geolocator: ^14.1.1
  http: ^1.6.0
  intl: any
  latlong2: ^0.10.1
  shared_preferences: ^2.5.6
  vector_map_tiles: 9.0.0-beta.13
  vector_tile_renderer: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Strings come from lib/l10n/*.arb, generated from the web's messages (tool/gen_l10n.mjs).
  generate: true
  # Fonts from the mobile design system (project/fonts); family name must match hwFontFamily in lib/theme/hw_theme.dart.
  fonts:
    - family: IBMPlexSansThai
      fonts:
        - asset: assets/fonts/IBMPlexSansThai-Regular.ttf
        - asset: assets/fonts/IBMPlexSansThai-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansThai-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansThai-Bold.ttf
          weight: 700
